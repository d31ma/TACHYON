<section class="section" aria-labelledby="faq-heading">
  <div class="text-center">
    <span class="eyebrow">Common questions</span>
    <h2 id="faq-heading" class="section-title">Questions to ask before you choose Tachyon.</h2>
  </div>

  <w-expansion-panels single class="mt-10 mx-auto max-w-[52rem]">
    <loop :for="entry of data.faq">
      <w-expansion-panel :header="entry.question">
        <p class="text-pretty opacity-85"><loop :for="part of inlineCode.parts(entry.answer)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></p>
      </w-expansion-panel>
    </loop>
  </w-expansion-panels>
</section>
