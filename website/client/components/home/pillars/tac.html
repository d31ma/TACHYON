<section class="section" aria-labelledby="pillars-heading">
  <div class="text-center">
    <span class="eyebrow">Why Tachyon</span>
    <h2 id="pillars-heading" class="section-title">One project for every target.</h2>
    <p class="section-lede">
      The same project runs in a browser. It also installs as an app on five platforms. You do
      not need a second codebase, and you do not need to install a runtime next to the app.
    </p>
  </div>

  <div class="pillars mt-10">
    <loop :for="pillar of data.pillars">
      <article class="pillar">
        <h3 class="pillar__title">{pillar.title}</h3>
        <p class="pillar__body"><loop :for="part of inlineCode.parts(pillar.body)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></p>
      </article>
    </loop>
  </div>
</section>
