<section class="section" aria-labelledby="quickstart-heading">
  <div class="text-center">
    <span class="eyebrow">Quick start</span>
    <h2 id="quickstart-heading" class="section-title">Start in three commands.</h2>
    <p class="section-lede">
      Tachyon writes the web bundle to <code>dist/web/</code>. To build a native app from the
      same source, add <code>--target macos</code>, <code>windows</code>, <code>linux</code>,
      <code>android</code> or <code>ios</code>.
    </p>
  </div>

  <div class="grid-auto mt-10" style="--col: 15rem; --grid-gap: var(--gutter)">
    <loop :for="step of data.quickstart">
      <div class="quickstart-step panel p-gutter">
        <p class="stat-value text-2xl">{step.number}</p>
        <p class="mt-3 text-card-title font-semibold">{step.title}</p>
        <pre class="code-block mt-3"><code>{step.command}</code><button
          type="button" class="code-copy" on:click="clipboard.copy(step.number, step.command)"
          :aria-label="'Copy step ' + step.number">{clipboard.label(step.number)}</button></pre>
        <p class="mt-3 text-sm opacity-70 text-pretty"><loop :for="part of inlineCode.parts(step.note)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></p>
      </div>
    </loop>
  </div>
</section>
