<w-app-bar sticky scroll-behavior="elevate">
  <w-container size="xl" class="site-bar w-row align-center ga-2 px-0">
    <a href="/" class="site-bar__brand w-row align-center ga-2 mr-auto" aria-label="Tachyon home">
      <img src="/shared/assets/logo.svg" alt="" aria-hidden="true" width="26" height="26" class="block" />
      <span class="site-bar__wordmark font-bold tracking-widest text-sm">TACHYON</span>
    </a>

    <nav class="site-bar__nav w-row align-center ga-1" aria-label="Primary">
      <w-btn href="/docs" variant="text" size="sm">Docs</w-btn>
      <a class="w-btn w-btn--text w-btn--sm" href="https://github.com/d31ma/Tachyon"
         target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>

    <div class="site-bar__actions w-row align-center ga-1">
      <site-search hydrate="load" />
      <w-btn variant="text" size="sm" w-theme-toggle aria-label="Switch between the light and dark theme">◐</w-btn>
      <w-btn href="/docs/install" variant="filled" color="primary" size="sm">Get started</w-btn>
    </div>
  </w-container>
</w-app-bar>
