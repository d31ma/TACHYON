<w-btn variant="text" size="sm" class="site-search__trigger" on:click="search.open()" aria-label="Search documentation">
  Search <kbd class="ml-2 opacity-60 text-xs">⌘K</kbd>
</w-btn>

<logic :if="search.showing">
  <div class="search-scrim" on:click="search.close()"></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search documentation">
    <input
      id="site-search-input"
      class="search-input"
      type="search"
      :value="search.term"
      on:input="search.find($event.target.value)"
      on:keydown="search.dismiss($event.key)"
      placeholder="Search the documentation"
      aria-label="Search documentation"
      autocomplete="off"
    >
    <p class="text-sm opacity-70 px-4 py-2" aria-live="polite">{search.status()}</p>
    <ul class="search-results">
      <loop :for="hit of search.results">
        <li>
          <a class="search-hit" :href="hit.path">
            <span>{hit.title}</span>
            <span class="text-xs opacity-60">{hit.kind}</span>
          </a>
        </li>
      </loop>
    </ul>
  </div>
</logic>
