<w-btn variant="text" size="sm" class="site-search__trigger" on:click="search.open()" aria-label="Search documentation" aria-haspopup="dialog">
  <span class="site-search__icon" aria-hidden="true"></span>
  <span class="site-search__label">Search</span>
  <kbd class="site-search__hint text-xs">{search.keyHint}</kbd>
</w-btn>

<logic :if="search.showing">
  <dialog id="site-search-dialog" class="search-panel" aria-label="Search documentation" tabindex="-1"
          on:keydown="search.handleKey($event.key, $event.shiftKey)" on:cancel="search.cancel()"
          on:click="search.closeFromBackdrop($event.target)">
    <div class="search-bar">
      <input
        id="site-search-input"
        class="search-input"
        type="search"
        :value="search.term"
        on:focus="search.prepare(data.docs, data.features)"
        on:input="search.find($event.target.value)"
        placeholder="Search the documentation"
        aria-label="Search documentation"
        aria-describedby="site-search-status"
        autocomplete="off"
      >
      <button type="button" class="search-close" on:click="search.close()" aria-label="Close search">×</button>
    </div>
    <p id="site-search-status" class="search-status text-sm px-4 py-2" aria-live="polite">{search.status()}</p>
    <ul class="search-results">
      <loop :for="hit of search.results">
        <li>
          <a class="search-hit" :href="hit.path">
            <span>{hit.title}</span>
            <span class="search-hit__kind text-xs">{hit.kind}</span>
          </a>
        </li>
      </loop>
    </ul>
  </dialog>
</logic>
