<nav class="docs-pager" aria-label="Pagination">
  <logic :if="pager.previous()">
    <a class="docs-pager__link" :href="pager.previous().path" rel="prev">
      <span class="docs-pager__label">Previous</span>
      <span class="docs-pager__title">{pager.previous().title}</span>
    </a>
  </logic>
  <logic :if="pager.next()">
    <a class="docs-pager__link docs-pager__link--next" :href="pager.next().path" rel="next">
      <span class="docs-pager__label">Next</span>
      <span class="docs-pager__title">{pager.next().title}</span>
    </a>
  </logic>
</nav>
