<main class="docs-article">
  <docs-pagelinks :source="feature.source" :path="feature.path()" />

  <logic :if="feature.entry().group">
    <p class="feature-group">
      <a :href="feature.groupAnchor()">{feature.entry().group}</a>
    </p>
  </logic>
  <h1 class="text-title font-semibold text-balance">{feature.entry().title}</h1>
  <p class="mt-3 text-lede opacity-80 text-pretty"><loop :for="part of inlineCode.parts(feature.entry().summary)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></p>

  <logic :if="feature.files().length">
    <div class="mt-6">
      <docs-snippet :files="feature.files()" axis="platform" hydrate="load" />
    </div>
  </logic>

  <logic :if="feature.entry().verify">
    <p class="mt-4 text-sm opacity-60 text-pretty">
      Checked by <code>{feature.entry().verify}</code>.
    </p>
  </logic>

  <docs-pager :path="feature.path()" :documents="data.docs" :features="data.features" />
</main>

<aside class="docs-toc" aria-hidden="true"></aside>
