<button type="button" class="docs-nav-toggle" on:click="drawer.toggle()"
        :aria-expanded="drawer.open ? 'true' : 'false'" aria-controls="docs-nav-panel">
  <span aria-hidden="true">☰</span> Documentation menu
</button>

<div class="docs-nav-scrim" :data-open="drawer.open ? 'true' : 'false'" on:click="drawer.close()"></div>

<nav id="docs-nav-panel" aria-label="Documentation" class="docs-nav"
     :data-open="drawer.open ? 'true' : 'false'" on:keydown="drawer.dismiss($event.key)">
  <loop :for="section of sidebar.sections()">
    <p class="docs-nav__heading">{section.heading}</p>
    <details class="docs-nav__section" :open="section.open">
      <summary class="docs-nav__summary">
        <span>{section.name}</span>
        <span class="docs-nav__chevron" aria-hidden="true">›</span>
      </summary>
      <ul class="docs-nav__list list-none p-0 m-0">
        <loop :for="link of section.links">
          <li>
            <a class="docs-nav__link" :href="link.path"
               :aria-current="link.current ? 'page' : 'false'">{link.title}</a>
          </li>
        </loop>
      </ul>
    </details>
  </loop>
</nav>
