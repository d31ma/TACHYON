<div class="demo">
  <logic :if="snippet.spans()">
    <div class="demo-os-tabs" role="tablist" aria-label="Platform">
      <loop :for="platform of snippet.platforms()">
        <button type="button" class="demo-os-tab" role="tab"
                :aria-selected="platform.current ? 'true' : 'false'"
                :tabindex="platform.current ? '0' : '-1'"
                on:click="platformChoice.choose(platform.id)">{platform.label}</button>
      </loop>
    </div>
  </logic>

  <logic :if="snippet.companions().length > 1">
    <div class="demo-os-tabs demo-os-tabs--companion" role="tablist"
         :aria-label="axis === 'language' ? 'Language' : 'Companion'">
      <loop :for="companion of snippet.companions()">
        <button type="button" class="demo-os-tab" role="tab"
                :aria-selected="companion.current ? 'true' : 'false'"
                :tabindex="companion.current ? '0' : '-1'"
                on:click="snippet.pick(companion.name)">{companion.label}</button>
      </loop>
    </div>
  </logic>

  <div class="demo-code">
    <loop :for="file of snippet.shown()">
      <div class="demo-code-col">
        <p class="demo-code-label">
          <span class="demo-code-name">{file.name}</span>
          <logic :if="file.language">
            <span class="demo-code-language">{file.language}</span>
          </logic>
        </p>
        <pre class="code-block" tabindex="0"><code>{file.code}</code><button
          type="button" class="code-copy" on:click="clipboard.copy(file.name, file.code)"
          :aria-label="'Copy ' + file.name">{clipboard.label(file.name)}</button></pre>
      </div>
    </loop>
  </div>
</div>
