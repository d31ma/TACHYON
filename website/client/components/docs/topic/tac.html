<main class="docs-article">
  <docs-pagelinks :source="topic.source" :path="topic.path()" />

  <h1 class="text-title font-semibold text-balance">{topic.entry().title}</h1>
  <p class="mt-3 text-lede opacity-80 text-pretty"><loop :for="part of inlineCode.parts(topic.entry().summary)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></p>
  <p class="mt-3 text-sm opacity-60">{readingTime.label(topic.words())}</p>
  <logic :if="topic.before().length > 0">
    <p class="docs-before mt-3 opacity-80 text-pretty">Before you start, read: <loop :for="link of topic.before()"><a :href="link.path">{link.title}</a>{link.separator}</loop></p>
  </logic>

  <loop :for="section of topic.sections()">
    <section class="mt-10">
      <h2 :id="section.anchor" class="text-heading font-semibold text-balance">{section.heading}</h2>
      <loop :for="block of section.blocks">
        <logic :if="block.text">
          <p class="mt-2 opacity-85 text-pretty"><loop :for="part of inlineCode.parts(block.text)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></p>
        </logic>
        <logic :if="block.rows">
          <table class="mt-4 text-sm">
            <thead><tr><loop :for="cell of block.header"><th class="border border-line px-4 py-2">{cell}</th></loop></tr></thead>
            <tbody><loop :for="row of block.rows"><tr><loop :for="cell of row"><td class="border border-line px-4 py-2"><loop :for="part of inlineCode.parts(cell)"><logic :if="part.code"><code class="inline-code">{part.text}</code></logic><logic :if="!part.code">{part.text}</logic></loop></td></loop></tr></loop></tbody>
          </table>
        </logic>
      </loop>
      <logic :if="section.code">
        <docs-snippet :files="section.single" axis="platform" hydrate="load" />
      </logic>
      <logic :if="section.files">
        <docs-snippet :files="section.files" :axis="section.axis" hydrate="load" />
      </logic>
    </section>
  </loop>

  <docs-pager :path="topic.path()" :documents="data.guides" :features="data.features" />
</main>

<aside class="docs-toc" aria-label="On this page">
  <docs-toc :entries="topic.contents()" />
</aside>
