<div class="menu" on:click.outside="menu.close()">
  <button aria-haspopup="menu" on:click="menu.toggle()">Options</button>
  <logic :if="menu.open">
    <ul role="menu" on:document:keydown.escape="menu.close()">
      <li role="none"><button role="menuitem" on:click="menu.pick('rename')">Rename</button></li>
    </ul>
  </logic>
</div>
<form on:submit.prevent="composer.send()">
  <textarea aria-label="Message" on:keydown.enter.prevent="composer.send()" on:input="composer.text = $event.target.value"></textarea>
</form>
<color-picker on:w-change="theme.choose($event.detail)"></color-picker>
