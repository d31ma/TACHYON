<main>
  <button id="ask" on:click="greeting.ask()">Ask Yon</button>
  <button id="clear" on:click="greeting.clear()">Clear cached answer</button>
  <button id="override" on:click="greeting.askCustom()">Use custom adapter</button>
  <p id="message">{greeting.message}</p>
  <p id="loads">{greeting.loads}</p>
  <p id="clears">{greeting.clears}</p>
  <p id="custom">{greeting.custom}</p>
</main>
