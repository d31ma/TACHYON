[profile.default]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
serial = { max-threads = 1 }
heavy = { max-threads = 2 }
dotnet-web = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/reads_the_clock_and_secure_random_from_the_page$/) | test(simultaneous_gateway_and_endpoint_deadlines_reap_processes) | test(go_handler_code_cannot_reach_its_relay_deadline) | test(inheriting_descendants_are_bounded_and_reaped_for_every_outcome)'
test-group = 'serial'
retries = 2

# Relay boundary tests measure deadlines against wall-clock time, so a loaded machine can push them over.
[[profile.default.overrides]]
filter = 'binary(it) & test(/^relay_boundaries::/)'
test-group = 'serial'
retries = 2

[[profile.default.overrides]]
filter = 'test(a_csharp_service_is_webassembly_on_targets_that_do_not_link_it) | test(controller_errors::kotlin::error_handlers_answer_every_scenario)'
test-group = 'heavy'
retries = 1
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'test(every_generated_combination_passes_its_tests_with_coverage_and_builds) | test(a_method_a_case_only_names_fails_coverage_and_a_called_method_passes) | test(every_language_answers_the_same_problem_for_the_same_invalid_input)'
test-group = 'heavy'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'test(/tac_web::.*(csharp|fsharp|dotnet)|tac_web::fsharp_tests::|model_sources::tests::a_csharp_web|tac_implicit_mapping_(cs|fs)_|tac_model_binding::(a_csharp|an_fsharp)/)'
test-group = 'dotnet-web'

# The Python Tac browser test starts Pyodide four times in each of Chromium, Firefox and WebKit.
[[profile.default.overrides]]
filter = 'test(pinned_python_tac_services_async_models_and_offline_reload_use_the_real_compiler)'
slow-timeout = { period = "60s", terminate-after = 16 }
