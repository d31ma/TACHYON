<section id="reader-panel"><h2>reader</h2>
<button id="reader-inspect" on:click="reader.inspect()">Read reader</button>
<button id="reader-increment" on:click="reader.increment()">Increment reader</button>
<button id="reader-remember" on:click="reader.remember('hello')">Remember with reader</button>
<button id="reader-recall" on:click="reader.recall()">Recall with reader</button>
<p id="reader-identity">{reader.identity}</p><p id="reader-count">{reader.count}</p><p id="reader-recalled">{reader.recalled}</p></section>
