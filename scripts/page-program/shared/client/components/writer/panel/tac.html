<section id="writer-panel"><h2>writer</h2>
<button id="writer-inspect" on:click="writer.inspect()">Read writer</button>
<button id="writer-increment" on:click="writer.increment()">Increment writer</button>
<button id="writer-remember" on:click="writer.remember('hello')">Remember with writer</button>
<button id="writer-recall" on:click="writer.recall()">Recall with writer</button>
<p id="writer-identity">{writer.identity}</p><p id="writer-count">{writer.count}</p><p id="writer-recalled">{writer.recalled}</p></section>
