[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "Bundled SQLite 3.51.3 via sqlx-sqlite 0.9 (libsqlite3-sys <0.38); ty opens only the operator-configured datasource with create_if_missing(false), so exposure needs write access to that database and its -wal; remove when sqlx allows libsqlite3-sys >=0.39" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
exceptions = [
  { name = "foldhash", allow = ["Zlib"] },
  { name = "xxhash-rust", allow = ["BSL-1.0"] },
  { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
