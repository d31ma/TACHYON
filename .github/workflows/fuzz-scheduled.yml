name: Scheduled Fuzzing

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each fuzz target
        required: false
        default: "1800"

permissions:
  contents: read

concurrency:
  group: scheduled-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [html_frontend, template_frontend, handler_frame, native_planner, yon_annotations, application_config, managed_resource_headers]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rust-src

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Restore the most recent persistent corpus
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-

      - name: Check the requested fuzz duration
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '1800' }}
        run: |
          set -euo pipefail
          if ! [[ "${FUZZ_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "seconds must be an integer" >&2
            exit 2
          fi
          if [ "${FUZZ_SECONDS}" -lt 60 ] || [ "${FUZZ_SECONDS}" -gt 7200 ]; then
            echo "seconds must be between 60 and 7200" >&2
            exit 2
          fi

      - name: Fuzz the target under AddressSanitizer
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '1800' }}
          TAC_FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-20 fuzz run "${TAC_FUZZ_TARGET}" -- \
            -max_total_time="${FUZZ_SECONDS}" -rss_limit_mb=2048 -timeout=10

      - name: Publish any crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 90

      - name: Publish the evolved corpus
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30

      - name: Carry the evolved corpus into the next campaign
        if: always() && !cancelled()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
