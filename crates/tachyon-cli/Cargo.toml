[package]
name = "tachyon-cli"
description = "The Tachyon command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ty"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
serde_json.workspace = true
tachyon-contracts.workspace = true
tachyon-core.workspace = true
tachyon-diagnostics.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[features]
storage-all = ["tachyon-core/storage-all"]
storage-mysql = ["tachyon-core/storage-mysql"]
storage-postgres = ["tachyon-core/storage-postgres"]
storage-redis = ["tachyon-core/storage-redis"]
storage-sqlserver = ["tachyon-core/storage-sqlserver"]

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
