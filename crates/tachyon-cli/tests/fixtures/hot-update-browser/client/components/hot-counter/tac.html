<section aria-label="Hot counter">
  <button id="increment" on:click="hotCounter.increment()">Increase</button>
  <output id="count">{hotCounter.count}</output>
  <p id="module-version">{hotCounter.version}</p>
  <details id="details"><summary>More</summary><p>Mutable native DOM state</p></details>
  <label>Draft <input id="draft" value="authored" /></label>
</section>
