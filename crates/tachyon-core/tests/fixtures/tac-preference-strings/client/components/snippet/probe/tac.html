<section aria-label="Real website snippet integration">
  <button id="snippet-copy-probe" on:click="clipboard.copy('fixture', 'Fixture text')"
    :aria-label="clipboard.copied === 'fixture' ? 'Snippet copied' : 'Copy probe'">{clipboard.label('fixture')}</button>
  <div id="snippet-primary">
    <docs-snippet :files="snippetProbe.files" :axis="'platform'" />
  </div>
  <button id="snippet-late-show" on:click="snippetProbe.visible = true">Mount website snippet</button>
  <button id="snippet-late-hide" on:click="snippetProbe.visible = false">Unmount website snippet</button>
  <logic :if="snippetProbe.visible">
    <div id="snippet-late">
      <docs-snippet :files="snippetProbe.files" :axis="'platform'" />
    </div>
  </logic>
</section>
