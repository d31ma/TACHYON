<main>
  <h1>SVG namespace regression</h1>
  <button id="hide" on:click="svgNamespace.visible = false">Hide path</button>
  <button id="show" on:click="svgNamespace.visible = true">Show path</button>
  <button id="change" on:click="svgNamespace.viewBox = '0 0 48 48'">Change view box</button>
  <button id="remove-reference" on:click="svgNamespace.reference = null">Remove reference</button>
  <svg id="graphic" width="16" height="16" :viewBox="svgNamespace.viewBox" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs><linearGradient id="gradient" gradientUnits="userSpaceOnUse" gradientTransform="rotate(20)"></linearGradient></defs>
    <path id="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
    <use id="reference" tabindex="0" :xlink:href="svgNamespace.reference" :xml:lang="svgNamespace.language" xml:space="preserve"></use>
    <if :when="svgNamespace.visible"><path id="conditional-path" d="M0 0 L4 4"></path></if>
    <loop :for="point of svgNamespace.points"><circle data-probe="listed" :cx="point" cy="4" r="2"></circle></loop>
    <for :each="let number = 0; number &lt; 2; number++"><rect data-probe="counted" :x="number" y="1" width="1" height="1"></rect></for>
    <switch :value="svgNamespace.mode"><case :when="'first'"><g id="switched"><path d="M1 1 L2 2"></path></g></case><case default><g id="fallback"></g></case></switch>
    <foreignObject id="foreign" x="0" y="0" width="16" height="16">
      <div id="html-child"><label for="draft">Draft</label><input id="draft" :value="svgNamespace.label" on:input="svgNamespace.edit()"/><svg id="nested-svg" width="4" height="4" viewBox="0 0 4 4"><circle cx="2" cy="2" r="1"></circle></svg></div>
    </foreignObject>
  </svg>
  <slot-frame><circle id="slotted-circle" cx="4" cy="4" r="2"></circle></slot-frame>
</main>
