<main aria-label="Python Tac synchronous fixture">
  <h1 id="python-ready">{audit.ready()}</h1>
  <p id="view-lifecycle">{audit.snapshot()}</p>
  <h2>{counter.title}</h2>
  <p>{counter.fixed}</p>
  <button id="view-increment" on:click="counter.increment()">Increment</button>
  <p id="view-count">{counter.count}</p>
  <button id="view-echo" on:click="counter.currentGuide = counter.echo(counter.currentGuide)">Round-trip current guide</button>
  <p id="view-model">{counter.currentGuide.title}</p>
  <p id="view-echo-count">{counter.echoCount}</p>
</main>
