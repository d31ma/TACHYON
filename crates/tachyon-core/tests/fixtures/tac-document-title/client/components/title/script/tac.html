<p id="script-ready">{scriptTitle.writes}</p>
<button id="script-write" on:click="scriptTitle.write('Script click — 🦊')">Write script title</button>
<button id="script-empty" on:click="scriptTitle.write('')">Clear script title</button>
<button id="script-invalid" on:click="scriptTitle.oversized()">Refuse script title</button>
