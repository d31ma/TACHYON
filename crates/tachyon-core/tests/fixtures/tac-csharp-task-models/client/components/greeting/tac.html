<main>
  <p id="greeting-answer">{greeting.message}</p>
  <button id="greeting-ask" on:click="greeting.ask()">Ask Yon</button>
  <button id="greeting-nullable" on:click="greeting.nullable()">Read nullable</button>
  <button id="greeting-missing" on:click="greeting.missing()">Reject missing field</button>
  <button id="greeting-wrong-type" on:click="greeting.wrongType()">Reject wrong type</button>
  <button id="greeting-extra" on:click="greeting.extra()">Reject extra field</button>
  <button id="greeting-slow" on:click="greeting.slow()">Read slowly</button>
</main>
